[project]
name = "migkit"
dynamic = ["version"]
description = "Verify, repair, and move databases across engines - without trusting the mover."
readme = "README.md"
# 3.12: f-strings that hold a backslash or a quote of their own kind (PEP 701)
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "arkashira" }]
keywords = ["database", "migration", "cdc", "replication", "verification",
            "postgres", "mysql", "mongodb", "dms", "reconciliation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]
# Everything migkit imports is a hard dependency. An engine that is installed
# but cannot connect is a clear error; an engine that vanishes because someone
# forgot an extra is a support ticket on someone else's machine. Install size
# is the cheaper of the two.
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    # engine drivers - one per supported engine, all required
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "pymssql>=2.3",
    "clickhouse-connect>=0.8",
    # thin mode; direct path loads from 3.4
    "oracledb>=3.4",
    "ibm_db>=3.2",
    "pyodbc>=5.1",
    # IBM i through its own open-source database server, where neither
    # IBM's ODBC driver nor a Db2 Connect licence is here
    "mapepire-python>=1.0",
    # the EBCDIC code pages Python lacks (Thai cp838, cp1047, cp1140-9...)
    # for files described by COBOL copybooks
    "ebcdic>=2.0",
    # an SAP system's OData services and their metadata, the one way a
    # program not SAP's may read its extractors (ODP over OData)
    "pyodata>=1.12",
    # SaaS sources written as dlt sources, read in this process with their
    # own incremental state
    "dlt>=1.30",
    "cassandra-driver>=3.29",
    "opensearch-py>=3.0",
    "snowflake-connector-python>=3.6",
    "google-cloud-bigquery>=3.11",
    # the warehouses' exactly-once paths: BigQuery's committed write
    # streams, Snowflake's streaming channels, Redshift's IAM sign-in
    "google-cloud-bigquery-storage>=2.41",
    "snowpipe-streaming>=1.8",
    "redshift_connector>=2.1",
    # Iceberg and Delta tables as sides of a pair
    "pyiceberg[sql-sqlite,pyarrow]>=0.12",
    "deltalake>=1.6",
    "zstandard>=0.22",
    "mysql-replication>=1.0",
    "pymongo>=4.6",
    "redis>=5.0",
    "kafka-python>=2.2.15",
    # Avro bodies for the change stream and schema-registry-aware copies
    "fastavro>=1.9",
    # comparison and schema libraries driven by check/schema
    "reladiff",
    "datacompy",
    "pandas",
    "pyarrow",
    "sqlglot",
    # stored code proved by running it: inputs drawn and shrunk by
    # property search, and a branch the search never took solved for
    "hypothesis",
    "z3-solver",
    # the SQL written in an application's code, found by a parser of the
    # code's own language (`storedcode.appscan`)
    "ast-grep-py>=0.45",
    # DuckDB files as a side of a pair, and the diff of keys too many to
    # hold
    "duckdb>=1.1",
    # PostgreSQL structural diff. psycopg3 is pulled with the binary wrapper
    # on purpose: `results` asks only for psycopg[pool], which installs
    # without a libpq wrapper and then fails at import. It also writes the
    # rows: pipeline mode, client-side binding and COPY rendered to memory
    # came with 3.1.
    "results",
    "psycopg[binary,pool]>=3.1",
    # how much this machine can give a move (sizing)
    "psutil>=5.9",
    # the files that hold values, encrypted to the hop's recipients
    "pyrage>=1.2",
    # a hop's `schedule` read as the cron expression it is written in
    "croniter>=2.0",
    # cloud metadata for managed-service hops
    "boto3",
    "google-cloud-pubsub>=2.20",
    # a cloud's own copy as the target's seed (`cloudseed`): Azure's
    # Flexible Server restore and Cloud SQL's clone, through their APIs
    "azure-identity",
    "azure-mgmt-postgresqlflexibleservers",
    "azure-mgmt-mysqlflexibleservers",
    "google-api-python-client",
    # every provider's managed databases through its own API (`cloudapi`):
    # restore points before a cutover, clones, instance facts and the
    # parameters a change is offered through. Huawei Cloud's pins older
    # releases of two of these and lives in its own environment
    # (`migkit doctor --install`)
    "azure-mgmt-sql",
    "azure-mgmt-redis",
    "azure-mgmt-cosmosdb",
    "tencentcloud-sdk-python-common",
    "tencentcloud-sdk-python-cdb",
    "tencentcloud-sdk-python-postgres",
    "tencentcloud-sdk-python-mongodb",
    "tencentcloud-sdk-python-redis",
    "tencentcloud-sdk-python-cynosdb",
    "tencentcloud-sdk-python-sqlserver",
    "tencentcloud-sdk-python-mariadb",
    "alibabacloud_credentials",
    "alibabacloud_rds20140815",
    "alibabacloud_dds20151201",
    "alibabacloud_polardb20170801",
    "alibabacloud_r_kvstore20150101",
    "alibabacloud_polardbx20200202",
    "oci",
    "ibm-cloud-sdk-core",
    # the passwords `migkit init` keeps, in the OS keychain
    "keyring>=25",
    # Couchbase and Cosmos DB as sides of a pair: the key-value range
    # scan and multi-document writes, and the change feed by feed range
    # in all-versions-and-deletes mode (4.9.1b1 and later)
    "couchbase>=4.3",
    "azure-cosmos>=4.9.1",
    # the cloud-native services as sides of a pair: Spanner (both dialects,
    # change streams, partitioned reads), Bigtable (its change streams),
    # Firestore in both modes, Neptune's property graph by traversal, and
    # Amazon Keyspaces signed in to by AWS's own signature
    "google-cloud-spanner>=3.71",
    "google-cloud-bigtable>=2.48",
    "google-cloud-firestore>=2.33",
    "google-cloud-datastore>=2.26",
    "gremlinpython>=3.8",
    "cassandra-sigv4>=4.0",
    # the team told wherever it is: one scheme for each of about a
    # hundred services, behind migkit's own `notify`
    "apprise>=2.0",
    # a run as spans, sent where the operator's OTEL_* variables say
    "opentelemetry-sdk>=1.40",
    "opentelemetry-exporter-otlp-proto-http>=1.40",
    # a seed shipped on media (`ship`): the Azure appliance's blob
    # endpoint and the storage account it is imported into, and the Cloud
    # Storage bucket the Google appliance's parts land in
    "azure-storage-blob>=12.20",
    "google-cloud-storage>=2.18",
    # the web view and its API (`migkit.web`): requests, routes and
    # templates, served by a threaded production server with TLS; people
    # signed in by the organisation's OpenID Connect provider (the code
    # flow with PKCE, the ID token checked against its keys) or SAML
    # provider (the answer's signature proved), provisioned by SCIM
    # (filters read as SQL), the local operator's password hashed with
    # Argon2id
    "werkzeug>=3.0",
    "jinja2>=3.1",
    "cheroot>=10.0",
    "authlib>=1.3",
    "joserfc>=1.0",
    "signxml>=4.0",
    "argon2-cffi>=23.1",
    "scim2-filter-parser>=0.7",
]

[project.urls]
Homepage = "https://github.com/arkashira/migkit"
Repository = "https://github.com/arkashira/migkit"
Changelog = "https://github.com/arkashira/migkit/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# SQL Server's own bulk load (TDS bulk insert from a compiled core), which
# the target side of a SQL Server hop writes through where it is here. It
# brings Microsoft's ODBC driver, which is not open source: `migkit doctor
# --install` puts it in place once its terms are accepted, and without it
# a SQL Server target is written by statements
mssql-bulk = ["mssql-python>=1.15"]
# These were once the way to opt into an engine. They are all in the base
# install now; the names stay so existing install commands keep working.
mysql = []
mongo = []
kafka = []
redis = []
diff = []
dataframe = []
s3 = []
pgschema = []
# pytest-xdist runs the pure tests side by side; pytest-timeout ends a test
# that hangs (tools/final_suite.py)
dev = ["pytest", "faker", "hypothesis", "pexpect",
       "moto[rds,ec2,dynamodb]",
       "pytest-xdist", "pytest-timeout",
       # moto's server, the S3-compatible endpoint an appliance stands in as
       "flask", "flask-cors", "prometheus-client"]

[project.scripts]
migkit = "migkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# one source of truth for the version: the package itself. Keeping a
# second copy here is how they drift.
version = { attr = "migkit.__version__" }

[tool.setuptools.packages.find]
include = ["migkit*"]

[tool.setuptools.package-data]
# the instance catalog the machine advice weighs (`migkit.machine`), the
# managed-service catalogue (`migkit.managed`), the locks of what
# `doctor --install` fetches (`migkit.tools`), and the web view's pages,
# style and script (`migkit.web`)
migkit = ["data/*.json", "data/*.yaml", "data/*.txt",
          "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
markers = ["docker: needs a docker daemon",
           "vm: needs the migkit VM (Oracle, SQL Server, Db2, ASE, x86 images)",
           "long: takes minutes by design; its timeout is an hour",
           "release_gate: the scenario a release is held to (a managed pair's whole path, rehearsal to evidence)",
           "mssql: runs against SQL Server (the x86 workflow runs these)",
           "db2: runs against Db2 (the x86 workflow runs these)",
           "ase: runs against SAP ASE (the x86 workflow runs these)",
           "teradata: runs against a Teradata system (a Vantage Express VM on x86, MIGKIT_TERADATA_HOST)"]
# a hung test fails after 15 minutes instead of stopping the run; the
# signal method raises in the test, so its fixtures still tear down
# (tests/conftest.py gives `vm` and `long` tests more)
timeout = 900
timeout_method = "signal"
