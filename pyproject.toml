[project]
name = "migkit"
dynamic = ["version"]
description = "Verify, repair, and move databases across engines - without trusting the mover."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "arkashira" }]
keywords = ["database", "migration", "cdc", "replication", "verification",
            "postgres", "mysql", "mongodb", "dms", "reconciliation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]
# Everything migkit imports is a hard dependency. An engine that is installed
# but cannot connect is a clear error; an engine that vanishes because someone
# forgot an extra is a support ticket on someone else's machine. Install size
# is the cheaper of the two.
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    # engine drivers - one per supported engine, all required
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "mysql-replication>=1.0",
    "pymongo>=4.6",
    "redis>=5.0",
    "kafka-python>=2.0",
    # comparison and schema libraries driven by check/schema
    "reladiff",
    "datacompy",
    "pandas",
    "sqlglot",
    # PostgreSQL structural diff. psycopg3 is pulled with the binary wrapper
    # on purpose: `results` asks only for psycopg[pool], which installs
    # without a libpq wrapper and then fails at import.
    "results",
    "psycopg[binary,pool]",
    # cloud metadata for managed-service hops
    "boto3",
]

[project.urls]
Homepage = "https://github.com/arkashira/migkit"
Repository = "https://github.com/arkashira/migkit"
Changelog = "https://github.com/arkashira/migkit/blob/master/CHANGELOG.md"

[project.optional-dependencies]
# These were once the way to opt into an engine. They are all in the base
# install now; the names stay so existing install commands keep working.
mysql = []
mongo = []
kafka = []
redis = []
diff = []
dataframe = []
s3 = []
pgschema = []
dev = ["pytest", "faker"]

[project.scripts]
migkit = "migkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
# one source of truth for the version: the package itself. Keeping a
# second copy here is how they drift.
version = { attr = "migkit.__version__" }

[tool.setuptools.packages.find]
include = ["migkit*"]

[tool.pytest.ini_options]
markers = ["docker: needs a docker daemon"]
