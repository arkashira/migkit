hops:
  my-first-hop:
    engine: postgres            # postgres | mysql | mssql | mongodb | redis | kafka
    service: native             # playbook set: aws-dms | tencent-dts | gcp-dms | native
    source:
      host: source.example.com
      port: 5432
      user: postgres
      password: secret
    target:
      host: 10.0.0.1
      port: 5432
      user: root
      password: secret
    databases: []               # empty = discover from source
    workers: 4
    big_rows: 5000000
    slice: 1000000
