hops:
  my-first-hop:
    engine: postgres            # postgres | mysql | mssql | mongodb | redis | kafka
    service: native             # playbook set: aws-dms | tencent-dts | gcp-dms | native
    source:
      host: source.example.com
      port: 5432
      user: postgres
      password: secret
    target:
      host: 10.0.0.1
      port: 5432
      user: root
      password: secret
    databases: []               # source db names, empty = discover from source
    db_map: {}                  # optional src->dst rename, e.g. {cart_uat: cart}
                                #   config + reports stay keyed by the source
                                #   name; only the target connection is remapped
    workers: 4
    big_rows: 5000000
    slice: 1000000
