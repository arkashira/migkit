# Every managed database service migkit knows, provider by provider - the
# clouds' own and the DBaaS vendors'. Each entry says the engine migkit moves
# it as (or, for an engine migkit lacks, what it is); how it is recognised -
# what the server says of itself first, its address a hint only; what the
# account the service hands over may and may not do; how a server setting
# is changed on it, in the provider's own words; what following its changes
# needs; its restore points, limits and defaults. Read by migkit.managed.
# A fact its documentation does not give is left out or said as "not
# documented"; `where` is the word migkit.clouds names the service by, and
# (where, family) is one entry.
