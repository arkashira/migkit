version: 1
providers:
  aws:     {label: AWS, api: aws, console: the AWS console, cli: aws}
  gcp:     {label: Google Cloud, api: gcp, console: the Google Cloud console, cli: gcloud}
  azure:   {label: Azure, api: azure, console: the Azure portal, cli: az}
  tencent: {label: Tencent Cloud, api: tencent, console: the Tencent Cloud console, cli: tccli}
  alibaba: {label: Alibaba Cloud, api: alibaba, console: the Alibaba Cloud console, cli: aliyun}
  huawei:  {label: Huawei Cloud, api: huawei, console: the Huawei Cloud console, cli: hcloud}
  oracle:  {label: Oracle Cloud, api: oracle, console: the OCI console, cli: oci}
  ibm:     {label: IBM Cloud, api: ibm, console: the IBM Cloud console, cli: ibmcloud}
  # DBaaS vendors: api none - migkit drives no API of theirs, their console
  # is said
  atlas:           {label: MongoDB Atlas, api: none, console: the Atlas UI, cli: atlas}
  redis-cloud:     {label: Redis Cloud, api: none, console: the Redis Cloud console, cli: null}
  aiven:           {label: Aiven, api: none, console: the Aiven Console, cli: avn}
  neon:            {label: Neon, api: none, console: the Neon Console, cli: neon}
  supabase:        {label: Supabase, api: none, console: the Supabase dashboard, cli: supabase}
  planetscale:     {label: PlanetScale, api: none, console: the PlanetScale dashboard, cli: pscale}
  crunchy-bridge:  {label: Crunchy Bridge, api: none, console: the Crunchy Bridge dashboard, cli: cb}
  timescale:       {label: Tiger Cloud (Timescale), api: none, console: the Tiger Cloud console, cli: null}
  cockroach-cloud: {label: CockroachDB Cloud, api: none, console: the CockroachDB Cloud Console, cli: ccloud}
  yugabyte-cloud:  {label: YugabyteDB Aeon, api: none, console: the YugabyteDB Aeon UI, cli: ybm}
  singlestore:     {label: SingleStore Helios, api: none, console: the SingleStore Portal, cli: null}
  confluent:       {label: Confluent Cloud, api: none, console: the Confluent Cloud Console, cli: confluent}
services:

  # ---- AWS -------------------------------------------------------------------

  aws-rds-postgres:
    provider: aws
    where: rds
    label: Amazon RDS for PostgreSQL
    family: postgres
    distinct: null
    hosts: []
    signs: {pg_roles: [rds_superuser, rds_replication, rds_password, rdsadmin]}
    api: {product: rds, restore_point: snapshot, clone: true}
    admin:
      superuser: false
      role: rds_superuser
      alter_system: false
      createrole: true
      signal_backend: true
      owns_databases: true
      subscribe: true
      replication: "grant rds_replication to {who};"
    change:
      how: parameter group
      words: "in {label}'s DB parameter group: {name} = {value}{after}"
      cli: 'aws rds modify-db-parameter-group --db-parameter-group-name <its parameter group> --parameters "ParameterName={name},ParameterValue={value},ApplyMethod={apply}"'
      names: {wal_level: {logical: [rds.logical_replication, "1"]}}
    cdc:
      - "rds.logical_replication = 1 in the DB parameter group turns logical decoding on; the parameter is static, so the instance reboots to take it"
      - "the account that reads the log needs the rds_replication role, which an rds_superuser grants"
      - "a replication slot nobody reads keeps its WAL and fills the instance's storage"
    limits:
      max_connections: "LEAST({DBInstanceClassMemory/9531392}, 5000) by default, set in the DB parameter group"
      storage: "64 TiB"
    defaults: {time_zone: UTC}
    notes:
      - "the admin is created NOSUPERUSER CREATEDB CREATEROLE NOREPLICATION and is a member of rds_superuser; it may end any session with pg_terminate_backend or pg_cancel_backend"

  aws-rds-mysql:
    provider: aws
    where: rds
    label: Amazon RDS for MySQL
    family: mysql
    distinct: null
    hosts: []
    signs: {my_basedir: ["/rdsdbbin/"]}
    api: {product: rds, restore_point: snapshot, clone: true}
    admin:
      superuser: false
      role: rds_superuser_role
      super: false
      system_variables_admin: false
      connection_admin: false
      kill: "call mysql.rds_kill({id})"
      grant_option: true
      read_only_by_api: true
      binlog_retention: "call mysql.rds_set_configuration('binlog retention hours', 24);"
    change:
      how: parameter group
      words: "in {label}'s DB parameter group: {name} = {value}{after}"
      cli: 'aws rds modify-db-parameter-group --db-parameter-group-name <its parameter group> --parameters "ParameterName={name},ParameterValue={value},ApplyMethod={apply}"'
      names: {}
    cdc:
      - "the binary log is on while automated backups are on (a backup retention period above 0)"
      - "binlog_format ROW in the DB parameter group"
      - "the binary log is kept only as long as mysql.rds_set_configuration('binlog retention hours', N) says - by default it is purged as soon as possible - and 168 hours (7 days) is the most"
      - "the reading account needs REPLICATION SLAVE and REPLICATION CLIENT, which the admin may grant"
    limits:
      max_connections: "{DBInstanceClassMemory/12582880} by default (about one per 12 MiB of the class's memory), set in the DB parameter group"
      storage: "64 TiB"
    defaults: {time_zone: UTC}
    notes:
      - "from 8.0.36 the admin holds rds_superuser_role (with grant option) and the tables of the mysql schema can no longer be written directly"
      - "the admin has no SUPER, SYSTEM_VARIABLES_ADMIN or CONNECTION_ADMIN: another account's session is ended with mysql.rds_kill"

  aws-rds-mariadb:
    provider: aws
    where: rds-mariadb
