      - "change tracking: ALTER DATABASE ... SET CHANGE_TRACKING = ON, then per table"
    limits:
      max_connections: "30,000 sessions"
      storage: "16 TB General Purpose, 32 TB next-gen General Purpose, 4 to 16 TB Business Critical by hardware"
    defaults: {collation: SQL_Latin1_General_CP1_CI_AS, time_zone: UTC}
    notes:
      - "ALTER DATABASE cannot change READ_ONLY, SINGLE_USER, RESTRICTED_USER, OFFLINE or the recovery model there"
      - "its address (<name>.<dns zone>.database.windows.net) reads as Azure SQL Database; SERVERPROPERTY('EngineEdition') = 8 names Managed Instance"
      - "sp_configure works, bar a listed few options; the collation and the time zone are set only at creation"

  azure-flexible-postgres:
    provider: azure
    where: flexible
    label: Azure Database for PostgreSQL flexible server
    family: postgres
    distinct: null
    hosts: []
    signs: {pg_roles: [azure_pg_admin, azuresu]}
    api: {product: flexible-postgres, restore_point: point in time, clone: true}
    admin:
      superuser: false
      role: azure_pg_admin
      alter_system: false
      createrole: true
      signal_backend: false
      owns_databases: true
      subscribe: true
      replication: "alter role {who} with replication;"
    change:
      how: server parameter
      words: "server parameter {name} = {value}{after}"
      cli: "az {kind} flexible-server parameter set --resource-group <group> --server-name <server> --name {name} --value {value}"
      names: {}
    cdc:
      - "server parameter wal_level = logical, and max_worker_processes at least 16; the server restarts to take them"
      - "the reading account needs ALTER ROLE ... WITH REPLICATION, which the admin gives"
      - "up to PostgreSQL 16 a replication slot is lost when the server fails over to its standby, unless pg_failover_slots keeps it; from 17, sync_replication_slots and hot_standby_feedback do"
      - "the service drops a replication slot nobody reads once storage reaches its threshold"
    limits:
      max_connections: "by SKU: 50 on B1ms, 859 on D2, 1,718 on D4, 3,437 on D8, 5,000 from 16 vCores; 15 of them reserved"
      storage: "32 TiB on Premium SSD, 64 TiB on Premium SSD v2"
    defaults: {}
    notes:
      - "the admin is created NOSUPERUSER CREATEDB CREATEROLE and is a member of azure_pg_admin; azuresu (azure_superuser in some pages) is the service's own superuser"
      - "whether azure_pg_admin may end other roles' sessions is not in the product documentation; Microsoft Q&A answers show it holding pg_signal_backend and pg_create_subscription on PostgreSQL 16"
      - "the server turns read-only at 95% of its storage or under 5 GiB free"
      - "a restore always makes a new server; firewall rules and parameter values are not carried to it"
      - "CREATE SUBSCRIPTION is documented by example on a flexible server"

  azure-flexible-mysql:
    provider: azure
    where: flexible
    label: Azure Database for MySQL flexible server
    family: mysql
    distinct: null
    hosts: []
    signs: {my_variables: [azure_server_name, logical_server_name]}
    api: {product: flexible-mysql, restore_point: point in time, clone: true}
    admin:
      superuser: false
      role: ""
      super: false
      system_variables_admin: false
      connection_admin: false
      kill: "call mysql.az_kill({id})"
      grant_option: true
      read_only_by_api: false
      binlog_retention: "server parameter binlog_expire_logs_seconds = 86400"
    change:
      how: server parameter
      words: "server parameter {name} = {value}{after}"
      cli: "az {kind} flexible-server parameter set --resource-group <group> --server-name <server> --name {name} --value {value}"
      names: {}
    cdc:
      - "the binary log is always on, in ROW format"
      - "server parameter binlog_expire_logs_seconds is 0 by default - a binary log is purged as soon as it is freed - and is ignored while accelerated logs are on"
      - "the reading account needs REPLICATION SLAVE and REPLICATION CLIENT, which the admin holds and may grant"
      - "replicating out is not supported while Microsoft Entra authentication is configured"
    limits:
      max_connections: "by SKU, a table on the server parameters page (683 by default on D2ads_v5)"
      storage: "16 TiB; 32 TiB on Memory-Optimized"
    defaults: {}
    notes:
      - "no SUPER: of the dynamic privileges only REPLICATION_APPLIER, ROLE_ADMIN, SESSION_VARIABLES_ADMIN, SHOW ROUTINE and XA_RECOVER_ADMIN are granted, so no SYSTEM_VARIABLES_ADMIN or CONNECTION_ADMIN; another session is ended with mysql.az_kill"
      - "whether read_only is a server parameter here is not documented"
      - "the mysql schema is read-only; tables of mysql.__* are the service's own, and a replica out must filter them"
      - "sql_generate_invisible_primary_key is ON by default (an invisible my_row_id column); lower_case_table_names is 1"
      - "after a restore, time_zone is back to SYSTEM"

  azure-cosmos-nosql:
    provider: azure
    where: cosmos-nosql
    label: Azure Cosmos DB for NoSQL
    family: cosmosdb
    distinct: null
    hosts: []
    signs: {}
    api: {product: cosmosdb, restore_point: point in time, clone: true}
    admin:
      role: "the account keys, or data-plane roles (Cosmos DB Built-in Data Contributor, Data Reader)"
      superuser: false
    change:
      how: API
      words: "the account's settings (Azure portal, az cosmosdb): {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "the change feed in latest-version mode carries inserts and updates, not deletes"
      - "all-versions-and-deletes mode needs continuous backup on the account, starts only from now or a checkpoint, and is refused on an account whose partitions were ever merged"
    limits:
      item: "2 MB"
      partition: "20 GB per logical partition"
    defaults: {}
    notes:
      - "continuous backup (7, 30 or 35 days) restores into a new account; periodic backup is restored by a support request"

  azure-cosmos-mongodb:
    provider: azure
    where: cosmos
    label: Azure Cosmos DB for MongoDB (RU)
    family: mongodb
    distinct: null
    hosts: []
    signs: {}
    api: {product: cosmosdb, restore_point: point in time, clone: true}
    admin:
      superuser: false
      role: "the account keys (role-based access where EnableMongoRoleBasedAccessControl is on)"
      version: "7.0"
      commands_missing: [setUserWriteBlockMode, fsync, fsyncUnlock, killSessions, killOp, grantRolesToUser, revokeRolesFromUser, usersInfo]
      user_roles: false
      change_streams: "inserts, updates and replaces only - no deletes; a stream must $match, $project and ask fullDocument"
    change:
      how: API
      words: "the account's settings (Azure portal, az cosmosdb): {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "change streams carry inserts, updates and replaces - not deletes - and give no operationType or updateDescription"
    limits:
      document: "2 MB by default, 16 MB where that feature is turned on"
    defaults: {}
    notes:
      - "session commands are not supported and write concern is ignored (every write is a quorum write)"
      - "its 7.0 feature page lists killOp as unsupported and does not list setUserWriteBlockMode, fsync or the user-management commands"

  azure-documentdb:
    provider: azure
    where: cosmos-vcore
    label: Azure DocumentDB (formerly Azure Cosmos DB for MongoDB vCore)
    family: mongodb
    distinct: null
    hosts: []
    signs: {}
    api: {product: null, restore_point: point in time, clone: true}
    admin:
      superuser: false
      role: "userAdmin (the built-in admin); other users get readWriteAnyDatabase, clusterAdmin or readAnyDatabase"
      version: "8.0"
      commands_missing: [setUserWriteBlockMode, fsync, fsyncUnlock, grantRolesToUser, revokeRolesFromUser]
      user_roles: false
      change_streams: "on: inserts, updates and deletes; pre-images and streams across shards by a support request"
    change:
      how: API
      words: "the cluster's settings in the Azure portal: {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
