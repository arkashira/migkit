      cli: 'aws rds modify-db-cluster-parameter-group --db-cluster-parameter-group-name <its cluster parameter group> --parameters "ParameterName={name},ParameterValue={value},ApplyMethod={apply}"'
      names: {}
    cdc:
      - "the binary log is off by default: binlog_format (ROW) in the DB cluster parameter group turns it on, and the writer reboots to take it"
