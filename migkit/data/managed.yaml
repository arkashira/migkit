    defaults: {time_zone: UTC}
    notes:
      - "the admin is created NOSUPERUSER CREATEDB CREATEROLE NOREPLICATION and is a member of rds_superuser, as on RDS"
      - "the largest table is 32 TiB"

  aws-aurora-mysql:
    provider: aws
