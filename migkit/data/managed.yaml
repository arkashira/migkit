    change:
      how: console
      words: "the cache's settings in the Azure portal: {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "PSYNC, SYNC, REPLICAOF and REPLCONF are blocked: nothing outside the service replicates from it"
    limits:
      max_connections: "up to 200,000 by SKU"
