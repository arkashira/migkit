    change:
      how: server parameter
      words: "the cluster's server parameters in the Azure portal (coordinator and worker nodes): {name} = {value}{after}"
      cli: null
      names: {}
    cdc: []
    limits:
      max_connections: "per node: 300 up to 3 vCores, 500 up to 15, 1,000 from 16; the managed pooler takes up to 2,000"
      storage: "32 TiB per node (2 TiB on a single node)"
    defaults: {}
    notes:
      - "on a retirement path: Microsoft points new work to flexible server's elastic clusters"
      - "one database per cluster (citus); CREATE DATABASE fails, and other roles are created in the portal, not by the citus role"
      - "logical replication out of it is not documented"
      - "a restore makes a new cluster"

  azure-cache-redis:
    provider: azure
    where: cache
    label: Azure Cache for Redis
    family: redis
    distinct: null
    hosts: []
    signs: {}
    api: {product: redis, restore_point: "", clone: false}
    admin:
      role: "the access keys, or Microsoft Entra data access policies (Data Owner, Data Contributor, Data Reader, or a custom ACL string)"
