      role: ""
      alter_system: false
      createrole: false
      signal_backend: true
      owns_databases: false
      subscribe: false
      replication: "console: the repl user reads the log - its password is set through the API, and logical slots are made through the API"
    change:
      how: API
      words: "the deployment's configuration: {name} = {value}{after}"
      cli: "ibmcloud cdb deployment-configuration <deployment> '{\"configuration\": {\"{name}\": \"{value}\"}}'"
      names: {}
    cdc:
      - "wal_level = logical through the deployment's configuration (replica by default; the deployment restarts)"
      - "max_replication_slots and max_wal_senders above 20: 20 are kept for high availability"
