      words: "the event hub's settings in the Azure portal: {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "an event hub keeps its events 1 day (Basic), up to 7 days (Standard), up to 90 days (Premium, Dedicated), and is read from any offset still kept"
    limits:
      message: "256 KB (Basic), 1 MB (Standard, Premium), 20 MB (Dedicated)"
    defaults: {}
    notes:
      - "the Kafka endpoint is on Standard, Premium and Dedicated, at <namespace>.servicebus.windows.net:9093 over SASL_SSL"
      - "access is SAS or Entra roles, not Kafka ACLs; topics are not managed through the Kafka AdminClient; gzip is the only compression"

  # ---- Google Cloud ----------------------------------------------------------

  gcp-cloudsql-postgres:
    provider: gcp
    where: cloud-sql
    label: Cloud SQL for PostgreSQL
    family: postgres
    distinct: null
    hosts: ['\.sql-ps[ac]\.goog\.?$']
    signs: {pg_roles: [cloudsqlsuperuser, cloudsqladmin, cloudsqlagent, cloudsqlreplica, cloudsqlimportexport, cloudsqliamuser, cloudsqliamserviceaccount]}
    api: {product: cloudsql, restore_point: backup, clone: true}
    admin:
      superuser: false
      role: cloudsqlsuperuser
      alter_system: false
      createrole: true
      signal_backend: false
      owns_databases: true
      subscribe: true
      replication: "alter user {who} with replication;"
    change:
      how: database flag
      words: "database flag {name}={value}{after}"
      cli: "gcloud sql instances patch <instance> --database-flags={name}={value}  (the list replaces every flag the instance has: name the ones it keeps as well)"
      names: {wal_level: {logical: [cloudsql.logical_decoding, "on"]}}
    cdc:
      - "database flag cloudsql.logical_decoding = on (off by default; the instance restarts to take it)"
      - "the reading account needs the REPLICATION attribute: ALTER USER ... WITH REPLICATION, which a cloudsqlsuperuser gives"
      - "max_wal_senders and max_replication_slots are 10 by default; a restore does not bring replication state back"
      - "an instance with high availability cannot be a subscriber"
    limits:
      max_connections: "by memory: 25 at 0.5 GB, 50 at 1.7 GB, 100 from 3.75 GB, 200 from 6 GB, 400 from 15 GB, 600 from 30 GB, 800 from 60 GB, 1,000 from 120 GB"
      storage: "64 TB (3 TB on shared-core machines)"
    defaults: {charset: UTF8, collation: en_US.UTF8}
    notes:
      - "the admin (postgres) is a member of cloudsqlsuperuser with CREATEROLE and CREATEDB, and has neither SUPERUSER nor REPLICATION; ALTER ROLE cannot lift NOSUPERUSER or NOREPLICATION"
      - "cloudsqlsuperuser may create extensions, event triggers, replication users, publications and subscriptions"
      - "whether the admin may end other roles' sessions (pg_signal_backend) is not documented"
      - "a point-in-time recovery always makes a new instance (gcloud sql instances clone ... --point-in-time)"

  gcp-cloudsql-mysql:
    provider: gcp
    where: cloud-sql
    label: Cloud SQL for MySQL
    family: mysql
    distinct: null
    hosts: []
    signs: {my_variables: [cloudsql_iam_authentication]}
    api: {product: cloudsql, restore_point: backup, clone: true}
    admin:
      superuser: false
      role: cloudsqlsuperuser
      super: false
      system_variables_admin: false
      connection_admin: true
      kill: "kill {id}"
      grant_option: true
      read_only_by_api: false
      binlog_retention: "console: point-in-time recovery on, which keeps the binary log its transaction log retention days (1 to 7 on Enterprise, 1 to 35 on Enterprise Plus)"
    change:
      how: database flag
      words: "database flag {name}={value}{after}"
      cli: "gcloud sql instances patch <instance> --database-flags={name}={value}  (the list replaces every flag the instance has: name the ones it keeps as well)"
      names: {}
    cdc:
      - "the binary log is on with point-in-time recovery (gcloud sql instances patch --enable-bin-log restarts an existing instance)"
      - "binlog_format is set to ROW by Cloud SQL, binlog_row_image is full by default, and GTIDs cannot be turned off"
      - "the reading account needs REPLICATION SLAVE, REPLICATION CLIENT and SELECT"
    limits:
      max_connections: "no default is published: the server's max_connections says"
      storage: "64 TB"
      tables: "50,000 (500,000 with 32 cores and 200 GB or more)"
    defaults: {charset: utf8mb4}
    notes:
      - "root@% holds every privilege but SUPER and FILE; cloudsqlsuperuser (8.0 and later) adds CONNECTION_ADMIN, ROLE_ADMIN, SET_USER_ID (8.4: SET_ANY_DEFINER, ALLOW_NONEXISTENT_DEFINER), XA_RECOVER_ADMIN and CLOUDSQL_SPECIAL_VARIABLES_ADMIN; SYSTEM_VARIABLES_ADMIN is not among them"
      - "KILL ends another session (CONNECTION_ADMIN on 8.0); users carried over from 5.7 by an in-place upgrade lack CONNECTION_ADMIN; Cloud SQL's own users cannot be killed"
      - "a database made in the console is utf8 / utf8_general_ci; one made through gcloud or the API on 8.0 and later is utf8mb4 / utf8mb4_0900_ai_ci"
      - "default_time_zone is a flag set by hand (the instance restarts)"

  gcp-cloudsql-sqlserver:
    provider: gcp
    where: cloud-sql
    label: Cloud SQL for SQL Server
    family: mssql
    distinct: null
    hosts: []
    signs: {}
    api: {product: cloudsql, restore_point: backup, clone: true}
    admin:
      role: CustomerDbRootRole
      alter: false
      control: true
      kill: true
      availability_group: false
    change:
      how: database flag
      words: "database flag {name}={value}{after}"
      cli: "gcloud sql instances patch <instance> --database-flags={name}={value}  (the list replaces every flag the instance has: name the ones it keeps as well)"
      names: {}
    cdc:
      - "change data capture: EXEC msdb.dbo.gcloudsql_cdc_enable_db '<database>', then sys.sp_cdc_enable_table per table (SQL Server 2017, 2019, 2022 Standard and Enterprise)"
    limits:
      max_connections: "up to 32,767 user connections"
      storage: "64 TB"
    defaults: {time_zone: UTC}
    notes:
      - "the admin (sqlserver) holds ALTER ANY CONNECTION (KILL), ALTER ANY LOGIN, CREATE ANY DATABASE and VIEW SERVER STATE; sysadmin is not offered"
      - "whether ALTER DATABASE ... SET READ_ONLY is allowed is not documented; a read replica cannot be made while a database is read-only, single-user or offline"
      - "read replicas use read-scale availability groups; high availability is a regional persistent disk"
      - "the collation is set at creation and cannot be changed afterwards"

  gcp-alloydb:
    provider: gcp
    where: alloydb
    label: AlloyDB for PostgreSQL
    family: postgres
    distinct: null
    hosts: ['\.alloydb-psc\.goog\.?$']
    signs: {pg_roles: [alloydbsuperuser]}
    api: {product: alloydb, restore_point: backup, clone: true}
    admin:
      superuser: false
      role: alloydbsuperuser
      alter_system: false
      createrole: true
      signal_backend: false
      owns_databases: true
      subscribe: true
      replication: "alter user {who} with replication;"
    change:
      how: database flag
      words: "database flag {name}={value}{after}"
      cli: "gcloud alloydb instances update <instance> --cluster=<cluster> --region=<region> --database-flags={name}={value}  (the list replaces every flag the instance has: name the ones it keeps as well)"
      names: {wal_level: {logical: [alloydb.logical_decoding, "on"]}}
    cdc:
      - "database flag alloydb.logical_decoding = on (off by default; the instance restarts to take it)"
      - "the reading account needs ALTER USER ... WITH REPLICATION"
      - "max_replication_slots and max_wal_senders are 50 by default"
    limits:
      max_connections: "by vCPUs: 100 up to 2, 200 at 4, 400 at 8, 700 at 14, 800 at 16, 1,000 from 22; at most 240,000"
      storage: "16 TiB per cluster by default, 128 TiB at most"
    defaults: {}
    notes:
      - "the admin (postgres) is a member of alloydbsuperuser; AlloyDB gives no one the PostgreSQL superuser role"
      - "alloydbsuperuser may create extensions, event triggers, replication users, publications and subscriptions"
      - "whether the admin may end other roles' sessions (pg_signal_backend) is not documented"
      - "a restore (backup or continuous backup, 14 days by default, 1 to 35) always makes a new cluster"
      - "AlloyDB Omni is the same engine run by its owner: there postgres is a real superuser"

  gcp-spanner:
    provider: gcp
    where: spanner
    label: Spanner
    family: spanner
    distinct: null
    hosts: ['(^|\.)spanner(\.[a-z0-9-]+\.rep)?\.googleapis\.com$']
    signs: {}
    api: {product: spanner, restore_point: backup, clone: true}
    admin:
      role: "IAM"
      superuser: false
    change:
      how: database option
      words: "ALTER DATABASE ... SET OPTIONS ({name} = {value}){after}"
      cli: null
      names: {}
    cdc:
      - "change streams: CREATE CHANGE STREAM ... FOR ALL or FOR a table, kept 1 to 30 days (7 by default), read through the ReadChangeStream API; at most 10 per database"
    limits:
