      commit: "80,000 mutations"
    defaults: {time_zone: America/Los_Angeles}
    notes:
      - "point-in-time reads go back version_retention_period (1 hour by default, up to 7 days); a backup is restored into a new database"

  gcp-bigtable:
    provider: gcp
    where: bigtable
    label: Bigtable
    family: bigtable
    distinct: null
    hosts: ['(^|\.)bigtable(admin)?(\.[a-z0-9-]+\.rep)?\.googleapis\.com$']
