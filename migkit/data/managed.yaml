  # ---- Tencent Cloud ---------------------------------------------------------

  tencent-tencentdb-postgres:
    provider: tencent
    where: tencentdb
    label: TencentDB for PostgreSQL
    family: postgres
    distinct: null
    hosts: []
    signs: {pg_roles: [pg_tencentdb_superuser]}
    api: {product: postgres, restore_point: backup, clone: true}
    admin:
      superuser: false
      role: pg_tencentdb_superuser
      alter_system: false
      createrole: true
      signal_backend: true
      owns_databases: true
      subscribe: true
      replication: "alter role {who} with replication;"
    change:
      how: console
      words: "TencentDB console, the instance's parameter settings: {name} = {value}{after}"
      cli: "tccli postgres ModifyDBInstanceParameters --DBInstanceId <instance> --ParamList '[{\"Name\":\"{name}\",\"ExpectedValue\":\"{value}\"}]'"
      names: {}
    cdc:
      - "wal_level = logical in the console's Parameter Settings (the instance restarts to take it)"
      - "the admin holds REPLICATION and may give it to other accounts"
      - "the tencentdb_failover_slot extension (pg_create_logical_failover_slot) keeps a logical slot across a failover"
    limits:
      max_connections: "fixed by specification: 2,048 up to 8 cores 16 GB, 4,000 at 8 cores 32 GB, 5,500 at 8 cores 64 GB, up to 40,000 at 156 cores 960 GB"
      storage: "local SSD 3,000 to 16,000 GB by specification; cloud disk up to 32,000 GB (PostgreSQL 13 to 18)"
    defaults: {charset: "UTF8 or LATIN1, chosen at creation"}
    notes:
      - "the admin is not a superuser: pg_tencentdb_superuser holds CREATEDB, CREATEROLE and BYPASSRLS, may create publications, subscriptions and slots, and only it may end pg_tencentdb_superuser sessions; pg_execute_server_program and the server-file roles are withheld"
      - "the admin's name may not be postgres or begin with pg_ or tencentdb_"
      - "the public address runs through a load balancer (2,000 concurrent connections, 200 new per second, 20 Mbps); read-only instances have none"
      - "backups are physical only; a backup set or a time within the log retention is cloned into a new instance"
      - "SHOW tencentdb_version gives the kernel's version"

  tencent-tencentdb-mysql:
    provider: tencent
    where: tencentdb
    label: TencentDB for MySQL
    family: mysql
    distinct: null
    hosts: []
    signs: {my_variables: [cdb_kill_user_extra, cdb_more_gtid_feature_supported, txsql_fast_path_mode]}
    api: {product: cdb, restore_point: backup, clone: true}
    admin:
      superuser: false
      role: ""
      super: false
      system_variables_admin: false
      connection_admin: false
      kill: "kill {id}"
      grant_option: false
      read_only_by_api: false
      binlog_retention: "console: local binlog retention hours (ModifyLocalBinlogConfig SaveHours: 120 by default, 6 to 168)"
    change:
      how: console
      words: "TencentDB console, the instance's parameter settings: {name} = {value}{after}"
      cli: "tccli cdb ModifyInstanceParam --InstanceIds '[\"<instance>\"]' --ParamList '[{\"Name\":\"{name}\",\"CurrentValue\":\"{value}\"}]'"
      names: {}
    cdc:
      - "the binary log cannot be turned off; the local binary log is kept SaveHours (120 by default, 6 to 168)"
      - "Tencent's own migration guide asks binlog_format ROW, binlog_row_image FULL and gtid_mode ON of a source; GTID is turned on with OpenDBInstanceGTID"
      - "the default binlog_format and GTID state are not documented"
    limits:
      storage: "20 to 30,000 GB (single node), up to 32,000 GB (cluster edition)"
      tables: "above 300,000 tables backup, monitoring and upgrades may fail"
    defaults: {charset: "UTF8 (UTF8MB4 from 8.0.29)"}
    notes:
      - "root has no SUPER, SHUTDOWN or FILE: SET GLOBAL fails with error 1227 and a global setting goes through the console's Parameter Settings"
      - "the accounts listed in cdb_kill_user_extra (root@% by default) may KILL other accounts' sessions without SUPER"
      - "whether root holds GRANT OPTION, SYSTEM_VARIABLES_ADMIN or CONNECTION_ADMIN, and whether read_only is a console parameter, are not documented"
      - "VERSION() ends in -txsql"

  tencent-tencentdb-mariadb:
    provider: tencent
    where: tencentdb-mariadb
