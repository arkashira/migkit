    signs: {}
    api: {product: null, restore_point: snapshot, clone: false}
    admin:
      superuser: false
      role: atlasAdmin
      version: "9.0"
      commands_missing: [fsync, fsyncUnlock, grantRolesToUser, revokeRolesFromUser, usersInfo]
      user_roles: false
      change_streams: "on"
    change:
      how: console
      words: "the cluster's Additional Settings in the Atlas UI: {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "change streams are on; M10 and M20 clusters allow 100 open change streams, M30 and up 1,000"
      - "the oplog is sized in the cluster's Additional Settings (990 MB at least), and a minimum oplog window may be set there (24 hours by default)"
    limits:
      document: "16 MiB"
      max_connections: "by tier: 1,500 per node on M10"
    defaults: {}
    notes:
      - "database users are made in the Atlas UI, its CLI or Admin API only: Atlas rolls back any user changed on the server, and createUser, updateUser, grantRolesToUser and usersInfo are unsupported on dedicated clusters"
      - "on dedicated clusters (M10 and up) killOp ends only the caller's own operations; setParameter, shutdown and the replSet* commands are unsupported"
      - "setUserWriteBlockMode is not on Atlas's unsupported list; whether atlasAdmin holds its privilege is not documented"
      - "continuous cloud backup restores to a point in time, into this or another cluster of the same MongoDB version"

