    change:
      how: support request
      words: "Neon's server settings are changed by Neon support (Scale plan); {name} = {value} may be set per database or role instead (ALTER DATABASE / ALTER ROLE ... SET){after}"
      cli: null
      names: {}
    cdc:
      - "logical replication is turned on in the Neon Console (Settings, Postgres, Logical replication), its CLI or API: wal_level turns logical, every compute restarts, and it cannot be turned off again"
      - "max_wal_senders and max_replication_slots are 10; a slot left unread for about 40 hours is removed"
    limits:
      max_connections: "max(100, min(4000, floor(compute units x 419.66)))"
    defaults: {charset: UTF8, collation: C.UTF-8, time_zone: GMT}
    notes:
      - "neon_superuser holds CREATEDB, CREATEROLE, BYPASSRLS, REPLICATION, pg_read_all_data, pg_write_all_data, pg_signal_backend, pg_monitor and pg_create_subscription (PostgreSQL 16 and later)"
      - "the pooled address carries -pooler; replication and session-level work go to the direct one"
      - "instant restore rewinds a root branch in place (keeping the old state as a branch); a branch at a past point is a new copy"

  supabase-postgres:
    provider: supabase
    where: supabase
    label: Supabase
    family: postgres
    distinct: null
    hosts: ['\.supabase\.co$', '\.pooler\.supabase\.com$']
    signs: {}
    api: {product: null, restore_point: backup, clone: true}
    admin:
      superuser: false
      role: ""
      alter_system: false
      createrole: true
      signal_backend: false
      owns_databases: false
      subscribe: false
      replication: "console: read the log as postgres, or as a role created WITH REPLICATION (postgres may give it from PostgreSQL 17)"
    change:
      how: API
      words: "the project's Postgres configuration through Supabase's CLI or Management API: {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "logical replication is read over a direct connection: through the pooler it does not work"
      - "replication slots and WAL senders are bounded by compute size (5 up to Small, 8 on Large, 24 on XL)"
      - "wal_level's default is not documented"
    limits:
      max_connections: "by compute size: 60 direct (Nano, Micro), 90 (Small), 160 (Large), 240 (XL)"
      storage: "by compute size: 500 MB (Nano) up to 500 GB (XL) of disk"
    defaults: {}
    notes:
      - "the admin (postgres) is not a superuser; supabase_admin is the service's own"
      - "a restore goes into the same project, with downtime, and needs its subscriptions and replication slots dropped first; Duplicate Project makes a new copy"

  planetscale-mysql:
    provider: planetscale
    where: planetscale
    label: PlanetScale (MySQL, on Vitess)
    family: mysql
    distinct: null
    hosts: ['\.psdb\.cloud$']
    signs: {}
    api: {product: null, restore_point: backup, clone: true}
    admin:
      superuser: false
      role: ""
      super: false
      system_variables_admin: false
      connection_admin: false
      kill: ""
      grant_option: false
      read_only_by_api: false
      binlog_retention: ""
    change:
      how: not changeable
      words: "PlanetScale takes no global server settings (SET GLOBAL is unsupported): {name} = {value} is not one of them"
      cli: null
      names: {}
    cdc:
      - "PlanetScale does not replicate its binary log to outside databases: changes are read through Vitess VStream, over gRPC on port 443, with the connectors PlanetScale documents"
    limits:
      tables: "2,048 per database, 1,017 columns per table"
      transaction: "20 seconds; 100,000 rows and 64 MiB per query result"
      storage: "up to 4 TB of network storage"
    defaults: {collation: utf8mb4_0900_ai_ci, time_zone: UTC}
    notes:
      - "KILL, stored procedures and functions, triggers, events and LOAD DATA INFILE are unsupported; InnoDB only, and every table needs a unique key that is not null"
      - "foreign keys only in unsharded databases, and only where turned on in the database's settings"
      - "the time zone is UTC and cannot be changed; a connection lives at most 24 hours"
      - "a backup is restored into a new branch"

  planetscale-postgres:
    provider: planetscale
    where: planetscale
    label: PlanetScale for Postgres
    family: postgres
    distinct: null
    hosts: ['\.psdb\.cloud$']
    signs: {pg_roles: [pscale_superuser]}
    api: {product: null, restore_point: backup, clone: true}
    admin:
      superuser: false
      role: pscale_superuser
      alter_system: false
      createrole: true
      signal_backend: true
      owns_databases: true
      subscribe: true
      replication: "console: the default role holds REPLICATION; the log is read as it"
    change:
      how: console
      words: "the cluster's parameters in the PlanetScale dashboard (Clusters, Parameters): {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "wal_level = logical in the cluster's Parameters tab (the cluster restarts to take it)"
      - "replication slots are made with failover = true; sync_replication_slots = on and hot_standby_feedback = on are recommended so they survive a failover"
    limits: {}
    defaults: {}
    notes:
      - "the default role is NOSUPERUSER CREATEDB CREATEROLE REPLICATION BYPASSRLS; pscale_superuser holds pg_read_all_data, pg_write_all_data, pg_monitor, pg_signal_backend, pg_checkpoint, pg_maintain and pg_create_subscription"
      - "generally available since 2025-09-22; port 5432 is direct, 6432 the pooler"
      - "a point-in-time restore makes a new branch; extensions are installed again"

  crunchy-bridge-postgres:
    provider: crunchy-bridge
    where: crunchy-bridge
    label: Crunchy Bridge
    family: postgres
    distinct: null
    hosts: ['\.postgresbridge\.com$']
    signs: {}
    api: {product: null, restore_point: point in time, clone: true}
    admin:
      superuser: true
      role: ""
      alter_system: true
      createrole: true
      signal_backend: true
      owns_databases: true
      subscribe: true
      replication: "alter role {who} with replication;"
    change:
      how: console
      words: "the cluster's configuration parameters in the Crunchy Bridge dashboard or API: {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "logical replication is on by default: wal_level logical, max_wal_senders 10, max_replication_slots 10"
      - "from PostgreSQL 17 slots are synced to the high-availability replica"
    limits: {}
    defaults: {}
    notes:
      - "the postgres role is a real superuser; application is not"
      - "ALTER SYSTEM works but does not survive a failover and is not applied to the HA or replica nodes: the dashboard's parameters are the way"
      - "the pooler (port 5431) takes only roles that are neither superuser nor replication"
      - "a fork makes a new cluster at a point in time (10 days of backups)"

  timescale-postgres:
    provider: timescale
    where: timescale
    label: Tiger Cloud (Timescale)
    family: postgres
    distinct: null
    hosts: ['\.tsdb\.cloud\.timescale\.com$']
    signs: {pg_roles: [tsdbowner]}
    api: {product: null, restore_point: point in time, clone: true}
    admin:
      superuser: false
      role: ""
      alter_system: false
      createrole: false
      signal_backend: false
      owns_databases: false
      subscribe: true
      replication: ""
    change:
      how: console
      words: "the service's Database parameters in the Tiger Cloud console: {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "following its changes (it as a logical replication source) is not documented; it is documented as a target"
    limits:
      max_connections: "25 on the Performance plan; 25 to 500 on larger compute"
    defaults: {}
    notes:
      - "the admin (tsdbadmin) is not a superuser; tsdbowner is a group role; one database (tsdb) per service"
      - "tsdbadmin may grant pg_checkpoint, pg_monitor, pg_signal_backend, pg_read_all_stats and pg_stat_scan_tables"
      - "a recovery fork makes a new service at a point in time (3 days on Performance, 14 on Scale and Enterprise)"

  cockroach-cloud:
    provider: cockroach-cloud
    where: cockroach-cloud
    label: CockroachDB Cloud
    family: cockroachdb
    distinct: null
    hosts: ['\.cockroachlabs\.cloud$']
    signs: {}
    api: {product: null, restore_point: backup, clone: false}
    admin:
      role: admin
      superuser: true
    change:
      how: cluster setting
      words: "SET CLUSTER SETTING {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "changefeeds: kv.rangefeed.enabled is on by default on Basic and Standard, set with SET CLUSTER SETTING on Advanced; creating one needs the CHANGEFEED privilege or admin"
    limits: {}
    defaults: {}
    notes:
      - "users made in the Cloud Console or API are granted the admin SQL role"
      - "managed backups (hourly on Standard, daily on Basic, kept 30 days) restore the whole cluster into an empty one"

  yugabyte-aeon:
    provider: yugabyte-cloud
    where: yugabyte-cloud
    label: YugabyteDB Aeon
    family: none
    distinct: "a distributed SQL database that speaks PostgreSQL's wire protocol (YSQL) and Cassandra's (YCQL), with a logical replication of its own: its LSNs are not byte offsets, and pg_current_wal_lsn, pg_wal_lsn_diff and IDENTIFY_SYSTEM are refused"
    hosts: ['\.yugabyte\.cloud$']
    signs: {}
    api: {product: null, restore_point: backup, clone: true}
    admin:
      role: "yb_superuser (the admin user is a member)"
      superuser: false
    change:
      how: console
      words: "the cluster's settings in the YugabyteDB Aeon UI: {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "change data capture over PostgreSQL's logical replication protocol with its own output plugin (yboutput), from v2024.1.1, two slots at first, not on Sandbox clusters"
    limits: {}
    defaults: {}
    notes:
      - "yb_superuser holds CREATEROLE, CREATEDB, BYPASSRLS, pg_signal_backend, yb_db_admin and yb_extension"
      - "backups every 24 hours kept 8 days, restorable into another cluster; a clone to a point in time makes a new database"

  singlestore-helios:
    provider: singlestore
    where: singlestore
    label: SingleStore Helios
    family: none
    distinct: "a distributed SQL database of its own (formerly MemSQL) that speaks MySQL's wire protocol"
    hosts: ['\.svc\.singlestore\.com$']
    signs: {}
    api: {product: null, restore_point: "", clone: false}
    admin:
      role: "admin (the user the portal creates)"
      superuser: false
    change:
      how: console
      words: "the workspace's settings in the SingleStore Portal: {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "an OBSERVE query reading changes from an offset appears in its release notes only"
    limits: {}
    defaults: {}
    notes:
      - "its server banner reads 5.5.58 MemSQL source distribution"

  confluent-kafka:
    provider: confluent
    where: confluent
    label: Confluent Cloud
    family: kafka
    distinct: null
    hosts: ['\.confluent\.cloud$']
    signs: {}
    api: {product: null, restore_point: "", clone: false}
    admin:
      role: "service accounts and API keys; ACLs from the Confluent CLI, REST API or Console"
      authorizer: false
    change:
      how: console
      words: "the cluster's settings in the Confluent Cloud Console (Dedicated clusters only; a topic's settings on every type): {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "a topic is read from any offset its retention still keeps"
    limits:
      message: "8 MB on Basic and Standard, 20 MB on Enterprise, Dedicated and Freight"
      max_connections: "1,000 (Basic), 10,000 (Standard), 576,000 (Enterprise), 2,736,000 (Dedicated, Freight)"
    defaults: {}
    notes:
      - "an ACL made through the Kafka admin API is not stated in its documentation; its audit log records CreateAcls from an admin client"
