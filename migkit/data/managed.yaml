    defaults: {collation: SQL_Latin1_General_CP1_CI_AS, time_zone: UTC}
    notes:
      - "the admin holds ALTER ANY CONNECTION (it may KILL others' sessions), ALTER ANY LOGIN, CREATE ANY DATABASE and VIEW SERVER STATE, and is no sysadmin"
      - "in a Multi-AZ deployment every database sits in database mirroring, an Always On availability group or block-level replication; there a database cannot be taken offline or renamed (documented), and whether SET READ_ONLY is refused there is not documented"

