      max_connections: "115 by default (15 reserved)"
    defaults: {time_zone: UTC}
    notes:
      - "ibm is the only superuser; admin holds pg_monitor and pg_signal_backend"
      - "CREATE SUBSCRIPTION needs a superuser: the service's create_subscription() and delete_subscription() functions stand in; CREATE PUBLICATION works"
      - "the time zone is always UTC and cannot be configured; a restore always makes a new deployment (point in time within 7 days)"

  ibm-icd-mysql:
