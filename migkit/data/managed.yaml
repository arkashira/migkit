      - "whether the admin may ALTER DATABASE ... SET READ_ONLY or KILL is not documented"
      - "the collation and the time zone are chosen at purchase; the console changes fill factor, max worker threads, cost threshold for parallelism, max degree of parallelism, optimize for ad hoc workloads, min server memory and blocked process threshold"

