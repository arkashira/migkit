      - "updateUser changes a password only, so a user's roles are not granted or revoked afterwards; setUserWriteBlockMode and fsync are not documented either way"

  azure-cosmos-cassandra:
    provider: azure
    where: cosmos
    label: Azure Cosmos DB for Apache Cassandra
    family: cassandra
    distinct: null
    hosts: ['\.cassandra\.cosmos(db)?\.azure\.com$']
    signs: {}
    api: {product: cosmosdb, restore_point: "", clone: false}
    admin:
      role: "the account's read-write or read-only keys"
      superuser: false
      authorizer: false
      authorize: false
    change:
      how: API
      words: "the account's settings (Azure portal, az cosmosdb): {name} = {value}{after}"
      cli: null
      names: {}
    cdc:
      - "the change feed, read with a query on COSMOS_CHANGEFEED_START_TIME(), carries inserts and updates, not deletes"
    limits:
      row: "2 MB"
    defaults: {}
    notes:
      - "CREATE/ALTER/DROP ROLE and USER, GRANT, REVOKE, LIST ROLES and LIST PERMISSIONS are not supported"
      - "gc_grace_seconds must be 0; continuous backup is not offered for this API, periodic backup is restored by a support request"
      - "Azure Managed Instance for Apache Cassandra is another service: Cassandra 4.0 or 5.0 nodes in the customer's network"

  azure-cosmos-postgres:
    provider: azure
    where: cosmos
    label: Azure Cosmos DB for PostgreSQL
    family: postgres
    distinct: null
    hosts: ['\.postgres\.cosmos\.azure\.com$']
    signs: {}
