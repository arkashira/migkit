      words: "Bigtable has no server settings: {name} = {value} is not one of its settings"
      cli: null
      names: {}
    cdc:
      - "change streams, turned on per table and kept 1 to 7 days, read with a single-cluster-routing app profile; schema and topology changes are not in them"
    limits:
      row: "256 MB"
      cell: "100 MB"
    defaults: {}
    notes:
      - "a backup is restored into a new table"
      - "a backup is one table's, taken at its own moment: an instance's tables have no one restore point together, so none is taken through the API"

  gcp-firestore:
    provider: gcp
    where: firestore
    label: Firestore
    family: firestore
    distinct: null
    hosts: ['(^|\.)firestore\.googleapis\.com$', '\.firestore\.goog$']
    signs: {}
    api: {product: firestore, restore_point: point in time, clone: true}
    admin:
      role: "IAM (roles/datastore.user for data)"
      superuser: false
    change:
      how: not changeable
      words: "Firestore has no server settings: {name} = {value} is not one of its settings"
