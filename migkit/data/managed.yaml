      role: ""
      super: false
      system_variables_admin: false
      connection_admin: false
      kill: "kill {id}"
      grant_option: false
      read_only_by_api: false
      binlog_retention: "console: the instance's log retention period (ModifyLogFileRetentionPeriod)"
    change:
      how: console
      words: "TencentDB console, the instance's parameter settings: {name} = {value}{after}"
      cli: "tccli mariadb ModifyDBParameters --InstanceId <instance> --Params '[{\"Param\":\"{name}\",\"Value\":\"{value}\"}]'"
      names: {}
    cdc:
      - "the binary log is always in ROW format; its GTIDs are not MySQL 5.6's, so a MySQL server cannot replicate from it"
    limits: {}
    defaults: {}
    notes:
