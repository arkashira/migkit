name: ci

# The same suite, the same script and the same shards as the final run
# (`tools/final_suite.py`): the pure tests side by side, the docker tests in
# lanes. The x86 engines each have a job in `x86-engines.yml`. Programs
# whose terms need the operator's acceptance are not installed here, so a
# missing program stays a skip (listed in the report) and only a server
# that never came up fails (`--strict server`).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:   # manual trigger for the heavy live-e2e job

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: the pure tests
        run: python tools/final_suite.py --only unit --strict server
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report-${{ matrix.python }}
          path: reports/final-suite/

  integration:
    runs-on: ubuntu-latest
    # estimated ~55 min in four lanes (tools/final_suite.py ESTIMATE);
    # set from the first measured run
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client default-mysql-client
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: the docker tests in lanes (the x86 engines run in x86-engines)
        run: >-
          python tools/final_suite.py --only docker,vm --strict server
          -m "not mssql and not db2 and not ase"
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: reports/final-suite/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build + validate distribution
        run: |
          python -m pip install -U pip build twine
          python -m build
          twine check dist/*
      - name: install the built wheel in a clean env
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/migkit --help >/dev/null && echo "wheel installs and runs"

  live-e2e:
    # heavy: pulls debezium/redpanda images. Manual only (workflow_dispatch).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: live debezium e2e
        env:
          MIGKIT_LIVE_E2E: "1"
        run: pytest tests/test_live_debezium.py -q -s
