name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e . faker pytest
      - name: unit + fail-case tests (no docker)
        run: pytest tests/test_unit.py tests/test_failcases.py -q -m "not docker"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mysql,mongo]" faker pytest
      - name: full suite (docker available on ubuntu runners)
        run: pytest tests/ -q
