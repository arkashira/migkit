name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:   # manual trigger for the heavy live-e2e job

jobs:
  guard:
    # cheapest job and the one whose failure means do not merge: the source has
    # to stay free of anything specific to whoever happens to be running it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: nothing organisation-specific in the source
        run: python tools/check_no_secrets.py
      - name: the version is the same everywhere it is written
        run: |
          PY=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PKG=$(python -c "import re;print(re.search(r'\"([^\"]+)\"', open('migkit/__init__.py').read()).group(1))")
          CL=$(grep -m1 -oE '^## v[0-9][^ ]*' CHANGELOG.md | tr -d '#v ' || true)
          echo "  pyproject=$PY  package=$PKG  changelog=$CL"
          [ "$PY" = "$PKG" ] || { echo "pyproject and migkit/__init__.py disagree"; exit 1; }
          [ -z "$CL" ] || [ "$CL" = "$PY" ] || { echo "CHANGELOG top entry is $CL, not $PY"; exit 1; }
      - name: no plaintext credential committed
        run: |
          if git grep -nIE "(password|passwd|secret[_-]?key|token)[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9/+=_-]{12,}" \
               -- ':!tests' ':!*.md' ':!docs' > /tmp/hits; then
            echo "possible credential in the source:"; cat /tmp/hits; exit 1
          fi
          echo "clean"

  unit:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mysql,mongo]" faker pytest
      - name: unit tests (no docker)
        run: pytest tests/ -q -m "not docker" --junitxml=junit-${{ matrix.python }}.xml
      - name: keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python }}
          path: junit-*.xml
          retention-days: 30

  integration:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: docker buildx
        uses: docker/setup-buildx-action@v3
      - name: pull the database images up front
        # pulling inside a test counts against that test's own patience, and a
        # slow registry then looks like a broken test. Fetch them once, here.
        run: |
          for img in postgres:16 mysql:8 mongo:7; do
            docker pull -q "$img" &
          done
          wait
          docker image ls --format '  {{.Repository}}:{{.Tag}} {{.Size}}'
      - name: install client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client default-mysql-client
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[mysql,mongo]" faker pytest
      - name: full suite
        run: pytest tests/ -q --junitxml=junit-integration.xml
      - name: keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: junit-integration.xml
          retention-days: 30
      - name: what the containers said, when something failed
        if: failure()
        run: |
          docker ps -a --format '  {{.Names}} {{.Image}} {{.Status}}'
          for c in $(docker ps -aq); do
            echo "--- $(docker inspect -f '{{.Name}}' "$c") ---"
            docker logs --tail 40 "$c" 2>&1 || true
          done

  package:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build + validate distribution
        run: |
          python -m pip install -U pip build twine
          python -m build
          twine check dist/*
      - name: install the built wheel in a clean env
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/migkit --help >/dev/null && echo "wheel installs and runs"
      - name: keep the build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 30

  live-e2e:
    # heavy: pulls debezium/redpanda images. Manual only (workflow_dispatch).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install -U pip
          pip install -e . faker pytest
      - name: live debezium e2e
        env:
          MIGKIT_LIVE_E2E: "1"
        run: pytest tests/test_live_debezium.py -q -s
