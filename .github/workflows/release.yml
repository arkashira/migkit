name: release

# Cutting a release is one command: push a tag.
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
# Everything after that happens here: the guard runs again, the full suite runs,
# the distribution is built and installed clean, the notes are generated from
# the commits, and the release is published with the artifacts attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    # the final run's shards (tools/final_suite.py), one job each: the pure
    # and docker tests, then each x86 engine on a runner of its own (a
    # runner's disk holds one of those images at a time). Timeouts from
    # the estimate in tools/final_suite.py; set from the first measured run
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: suite
            minutes: 200
            args: --strict server -m "not mssql and not db2 and not ase"
            image: ""
          - shard: mssql
            minutes: 90
            args: --strict server -m mssql
            image: mcr.microsoft.com/mssql/server:2022-latest
          - shard: db2
            minutes: 90
            args: --strict server -m db2
            image: ""
          - shard: ase
            minutes: 90
            args: --strict server -m ase
            image: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: nothing organisation-specific in the source
        run: python tools/check_no_secrets.py
      - name: docker buildx
        uses: docker/setup-buildx-action@v3
      - name: install client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client default-mysql-client unixodbc tdsodbc
      - name: the SQL Server client the native checks drive, from its releases
        if: matrix.shard == 'mssql'
        run: |
          curl -fsSL https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2 \
            | sudo tar -xjf - -C /usr/local/bin sqlcmd
      - name: install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: the suite, as the final run runs it
        env:
          # the full SQL Server where the shard is SQL Server's
          IMAGE: ${{ matrix.image }}
        run: |
          if [ -n "$IMAGE" ]; then export MIGKIT_MSSQL_IMAGE="$IMAGE"; fi
          python tools/final_suite.py ${{ matrix.args }}
      - name: keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-${{ matrix.shard }}
          path: reports/final-suite/

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # to sign the provenance
      attestations: write   # to store it beside the release
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the notes need the whole history and every tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: work out the tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: the tag must match the version in the package
        # pyproject's version is dynamic: migkit/__init__.py's __version__
        run: |
          PYVER=$(python -c "import ast;print(next(n.value.value for n in ast.parse(open('migkit/__init__.py').read()).body if isinstance(n, ast.Assign) and getattr(n.targets[0], 'id', '') == '__version__'))")
          if [ "$PYVER" != "${{ steps.tag.outputs.version }}" ]; then
            echo "tag says ${{ steps.tag.outputs.version }} but migkit/__init__.py says $PYVER"
            echo "bump __version__ in migkit/__init__.py, then retag"
            exit 1
          fi
          echo "version $PYVER matches the tag"
      - name: build + validate distribution
        run: |
          python -m pip install -U pip build twine
          python -m build
          twine check dist/*
      - name: install the built wheel in a clean env and run it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install "dist/migkit-${{ steps.tag.outputs.version }}-py3-none-any.whl"
          /tmp/v/bin/migkit --help >/dev/null
          /tmp/v/bin/migkit --version 2>/dev/null || true
          echo "wheel installs and runs"
      - name: release notes from the commits
        run: python tools/gen_changelog.py "${{ steps.tag.outputs.tag }}" > RELEASE_NOTES.md
      - name: software bill of materials (CycloneDX), of the wheel as installed
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py environment /tmp/v/bin/python --of JSON \
            -o "dist/migkit-${{ steps.tag.outputs.version }}.cdx.json"
      - name: checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: build provenance, signed through GitHub's Sigstore
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: the bill of materials, attested against the wheel
        uses: actions/attest-sbom@v2
        with:
          subject-path: dist/*.whl
          sbom-path: dist/migkit-${{ steps.tag.outputs.version }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/*
            RELEASE_NOTES.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
