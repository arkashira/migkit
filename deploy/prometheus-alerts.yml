# Alert rules for the metrics migkit serves at /metrics
# (`migkit report --serve`, scraped with the bearer MIGKIT_METRICS_TOKEN)
# and prints with `migkit report --metrics`. Load with `rule_files:` in
# prometheus.yml. The thresholds are starting points; change them to fit
# the migration. A hop's verdict is a state set - one sample a verdict,
# 1 for the one its last check ended as - so a hop never checked
# (status="none") fires none of the verdict rules.
groups:
  - name: migkit
    rules:
      - alert: MigkitHopDifferent
        expr: migkit_verdict{status="different"} == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.hop }}: the last check found a difference"

      - alert: MigkitHopError
        expr: migkit_verdict{status="error"} == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.hop }}: the last check could not verify"

      - alert: MigkitHopIncomplete
        expr: migkit_verdict{status="incomplete"} == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.hop }}: the last check found nothing different and
            did not compare everything

      - alert: MigkitMetricsStale
        expr: migkit_collect_age_seconds > 120
        labels:
          severity: warning
        annotations:
          summary: >-
            the metrics are read from a snapshot
            {{ $value | humanizeDuration }} old

      - alert: MigkitMetricsFailing
        expr: increase(migkit_collect_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: >-
            reading {{ $labels.family }} for the metrics failed in the
            last 15 minutes

      - alert: MigkitCheckStale
        expr: migkit_last_check_age_seconds > 86400
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.hop }}: not checked for a day"

      - alert: MigkitTailBehind
        expr: migkit_tail_behind_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.hop }} {{ $labels.db }}: the change tail has not
            reached the end of the source's log for
            {{ $value | humanizeDuration }}

      - alert: MigkitTailStalled
        expr: >-
          migkit_tail_running == 1 and migkit_tail_paused == 0
          and migkit_tail_heartbeat_age_seconds > 120
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.hop }} {{ $labels.db }}: the change tail has not
            gone round its loop for {{ $value | humanizeDuration }}

      - alert: MigkitTailGone
        expr: migkit_tail_running == 0
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.hop }} {{ $labels.db }}: the change tail's process
            is gone without stopping

      - alert: MigkitTailStopped
        expr: migkit_tail_stopped == 1
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.hop }} {{ $labels.db }}: the change tail stopped on
            an error

      - alert: MigkitRetentionShort
        expr: migkit_tail_retention_margin_seconds < 3600
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.hop }} {{ $labels.db }}: the source may drop what
            the change tail has not read within
            {{ $value | humanizeDuration }}

      - alert: MigkitRetentionBytesShort
        expr: migkit_tail_retention_margin_bytes < 1073741824
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.hop }} {{ $labels.db }}: the tail's slot loses WAL
            after {{ $value | humanize1024 }}B more is written

      - alert: MigkitTableDifferent
        expr: migkit_table_same == 0
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.hop }} {{ $labels.db }}.{{ $labels.table }}: its
            rows or digest differ between the two sides, as the last run
            that read both took them

      - alert: MigkitStreamBehind
        expr: migkit_stream_behind_source_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{ $labels.hop }}: the change stream is
            {{ $value | humanizeDuration }} behind the source

      - alert: MigkitStreamPartDown
        expr: migkit_stream_running == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: >-
            {{ $labels.hop }}: the change stream's {{ $labels.part }} is
            not running
